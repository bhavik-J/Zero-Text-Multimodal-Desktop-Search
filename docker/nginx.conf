server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50m;           # "search by image" uploads

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;            # live indexing progress (Server-Sent Events)
        proxy_cache off;
        proxy_read_timeout 600s;        # galaxy compute / first duplicate scan on big libraries
        proxy_send_timeout 600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
